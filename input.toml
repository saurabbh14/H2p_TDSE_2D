# TDSE 2D — Simulation Input File
# This file replaces the old Fortran namelist input.ini
# All lengths/distances in atomic units (a.u.), times in femtoseconds,
# wavelengths in nm, phases in units of pi, quiver amplitude in a.u.

[grid]
R_points  = 512        # number of R-grid points (NR)
R_min     = 0.1        # minimum R in a.u.
R_max     = 51.2       # maximum R in a.u.
x_points  = 1024       # number of x-grid points (Nx)
x_min     = -102.4     # minimum x in a.u.
x_max     = 102.4      # maximum x in a.u.

[system]
m1            = 1.0          # mass of nucleus 1 (amu)
m2            = 1.0          # mass of nucleus 2 (amu)
Nstates       = 2            # number of electronic BO states
sc_kind       = "on_grid"    # "on_grid" or "static"
sc_params     = "Z_interpolated_optimized_a2_parameters_with_go.txt"
bo_pot_kind   = "on_nuclr_grid"  # "on_nuclr_grid" or "Morse"
CalcMode      = "Lab"        # "Lab", "KH", or "KH_td"
guess_vstates = 100          # max vibrational states to compute

[time]
dt = 0.05        # time step in a.u.
Nt = 25000       # number of time steps

[initial_guess]
RI    = 0.7      # center of initial Gaussian (a.u.)
kappa = -5.0     # width of initial Gaussian (negative)

[initial_state]
distribution = "single vibrational state"  # "single vibrational state" | "gaussian distribution" | "Boltzmann distribution"
N_ini        = 1          # initial electronic state index
v_ini        = 1          # initial vibrational state index
RI_tdse      = 1.5        # Gaussian center for TDSE (a.u.)
kappa_tdse   = -5.0       # Gaussian std dev for TDSE

[io]
input_data_dir   = "input_data/"
output_data_dir  = "output_data/"
adb_pot          = "H2+_BO.dat"
trans_dip_prefix = ""

[methods]
propagator      = "split_operator" # "split_operator" or "rk4"
gauge           = "length"         # "length" or "velocity"
total_trans_off = 0
trans_off       = ""

[absorber]
kind  = "mask"   # "mask" or "CAP"
R_pos = 12.0     # absorber position from the end of the R-grid (a.u.)
x_pos = 15.0     # absorber position from the end of the x-grid (a.u.)

[snapshots]
enabled = false       # whether to write 2D wavefunction density snapshots
num_frames = 50       # total number of frames evenly distributed across propagation

# Final wavefunctions written as raw binaries at the end of the 2D propagation,
# so that the time evolution can be continued later.  Five files are written to
# the 2D time-propagation output directory, each with an (NR, Nx) header:
#   psi_final.bin                  main wave packet            (R , x )
#   psi_ion_final.bin              ionization channel          (R , Px)
#   psi_diss_final.bin             dissociation channel        (PR, x )
#   psi_diss_after_ion_final.bin   dissociation-after-ion.     (PR, Px)
#   psi_ion_after_diss_final.bin   ionization-after-diss.      (PR, Px)
[restart]
save = false          # write the final wavefunctions (main + continuum) as binaries

[output.td_density]
num_points = 250      # number of time points for td-density_R.out and td-density_x.out

[output.grid]
R_stride = 4          # output every Nth R-grid point in density/snapshot files
x_stride = 4          # output every Nth x-grid point in density/snapshot files
R_start  = 0.0        # fraction of R grid where output begins (0.0 = first point)
R_end    = 1.0        # fraction of R grid where output ends   (1.0 = last point)
x_start  = 0.25       # fraction of x grid where output begins
x_end    = 0.75       # fraction of x grid where output ends

[parallel]
prop_fftw     = "parallel"   # "parallel" or ""
itp_fftw      = ""           # "parallel" or ""
omp_nthreads  = 0            # 0 = use all available threads

# Laser pulses — add as many [[laser.pulses]] blocks as needed
#
# [laser] time_unit sets the default unit of the pulse durations `tp` and
# `rise_time` for every pulse; each [[laser.pulses]] block may override it.
#   "fs"     -> femtoseconds (default).  Note: in this mode the sin2 total
#               width and the trapezoidal rise/fall are rounded up to the
#               next whole optical cycle (printed as "…used" at startup).
#   "cycles" -> optical cycles of the pulse carrier; used exactly as given.
# `t_mid` is always in fs, independent of time_unit.
[laser]
time_unit = "fs"         # "fs" (default) | "cycles"

[[laser.pulses]]
envelope  = "sin2"       # "cos2" | "sin2" | "gaussian" | "trapezoidal"
lambda    = 228.0        # wavelength in nm
time_unit = "fs"         # unit of tp and rise_time: "fs" | "cycles"
tp        = 8.0          # pulse duration (FWHM for gaussian, total width for sin2/cos2, flat-top for trapezoidal)
t_mid     = 10.0         # pulse midpoint in fs (always fs)
alpha0    = 2.5          # quiver amplitude in a.u.
phi       = 0.0          # carrier-envelope phase in units of pi
rise_time = 4.0          # rise/fall time, same unit as tp (only used for trapezoidal)

[[laser.pulses]]
envelope  = "trapezoidal"
lambda    = 800.0
time_unit = "cycles"     # tp and rise_time below are in optical cycles
tp        = 0.0          # flat-top width in optical cycles
t_mid     = 0.0          # pulse midpoint in fs (always fs)
alpha0    = 0.0
phi       = 0.0
rise_time = 2.0          # rise/fall in optical cycles (must be > 0 for trapezoidal)